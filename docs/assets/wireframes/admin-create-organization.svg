<text x="96" y="207" fill="#212121" font-family="Arial" font-size="24" font-weight="bold">Create an organization</text>
<text x="96" y="241" fill="#616161" font-family="Arial" font-size="15">Set up an organization and appoint an existing account as its president.</text>
<text x="96" y="293" fill="#424242" font-family="Arial" font-size="14">Name *</text><rect x="96" y="304" width="1008" height="54" rx="4" fill="white" stroke="#757575"/><text x="114" y="338" fill="#212121" font-family="Arial" font-size="15">UBB Robotics Club</text><text x="96" y="381" fill="#616161" font-family="Arial" font-size="13">Required · Unique, at most 150 characters</text>
